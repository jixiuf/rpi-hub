[package]
name = "rpi-wechat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WeChat iLink Bot channel for rpi: lease-gated inbound polling and outbound replies"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true }
rpi-hub-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
rand = "0.8"
# Media milestone (Phase 3): AES-128-ECB file crypto.
# aes = "0.8"
# ecb = "0.1"
# md-5 = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
