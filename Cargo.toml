[workspace]
resolver = "2"
members = ["rpi-hub-core", "rpi-hub", "rpi-wechat"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rpi-hub-core = { path = "rpi-hub-core" }
# NOTE: uses the local patched SDK (register_argument_suggester, pi-rust PR);
# switch back to crates.io "=0.25" once that lands.
rpi-plugin-sdk = { path = "/Users/jixiuf/repos/pi-rust/crates/rpi-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
