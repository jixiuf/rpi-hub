[workspace]
resolver = "2"
members = ["rpi-hub-core", "rpi-hub"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rpi-hub-core = { path = "rpi-hub-core" }
rpi-plugin-sdk = "=0.24.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
